<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6a49">
<title>Bridge Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=JSON.parse(localStorage.getItem('bc:theme')||'{}').theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="title-row">
    <h1>Bridge Coach</h1>
    <button id="theme-btn" type="button" class="theme-btn" aria-label="Theme: automatic">◐ Auto</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="Bridge Coach">
    <button role="tab" id="tab-advisor" data-tab="advisor" aria-controls="advisor" aria-selected="true">Advisor</button>
    <button role="tab" id="tab-decoder" data-tab="decoder" aria-controls="decoder" aria-selected="false" tabindex="-1">Decoder</button>
    <button role="tab" id="tab-table" data-tab="table" aria-controls="table" aria-selected="false" tabindex="-1">Table</button>
    <button role="tab" id="tab-notes" data-tab="notes" aria-controls="notes" aria-selected="false" tabindex="-1">Notes</button>
  </nav>
</header>
<main>
  <section id="advisor" role="tabpanel" aria-labelledby="tab-advisor"></section>
  <section id="decoder" role="tabpanel" aria-labelledby="tab-decoder" hidden></section>
  <section id="table" role="tabpanel" aria-labelledby="tab-table" hidden></section>
  <section id="notes" role="tabpanel" aria-labelledby="tab-notes" hidden></section>
</main>
<div id="update-bar" class="update" hidden>
  <span>New version ready</span>
  <button id="update-btn" type="button">Tap to update</button>
</div>
<script type="module" src="js/ui/app.js"></script>
</body>
</html>
